name: luminaria

services:
  luminaria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminaria
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
      - ./output:/app/output
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_ENDPOINT=https://hf-mirror.com
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  model_cache:
    name: luminaria_model_cache
