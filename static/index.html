<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminAria — AI 音乐生成</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top bar -->
        <header class="topbar">
            <div class="logo">
                <span class="logo-icon">♬</span>
                <span>LuminAria</span>
            </div>
        </header>

        <!-- Three-column layout -->
        <main class="main-content">
            <!-- Left: reserved for future advanced settings -->
            <aside class="left-panel">
                <div class="params-card">
                    <h3 class="params-title">◇ 高级参数 ◇</h3>

                    <!-- Sampling Steps -->
                    <div class="param-group">
                        <div class="param-label-row">
                            <label class="param-label">采样步数</label>
                            <span class="param-value" id="stepsValue">25</span>
                        </div>
                        <div class="param-presets" id="stepsPresets">
                            <button class="preset-btn" data-value="15">15</button>
                            <button class="preset-btn active" data-value="25">25</button>
                            <button class="preset-btn" data-value="50">50</button>
                            <button class="preset-btn" data-value="100">100</button>
                        </div>
                        <div class="param-row param-row-solo">
                            <input type="range" id="stepsSlider" class="param-slider" min="10" max="100" value="25">
                        </div>
                    </div>

                    <!-- CFG Scale -->
                    <div class="param-group">
                        <div class="param-label-row">
                            <label class="param-label">CFG 引导强度</label>
                            <span class="param-value" id="cfgValue">6.0</span>
                        </div>
                        <div class="param-row param-row-solo">
                            <input type="range" id="cfgSlider" class="param-slider" min="10" max="150" value="60" step="5">
                        </div>
                    </div>

                    <!-- Seed -->
                    <div class="param-group">
                        <div class="param-label-row">
                            <label class="param-label">随机种子</label>
                            <span class="param-value" id="seedValueDisplay">-1</span>
                        </div>
                        <div class="seed-row">
                            <input type="number" id="seedInput" class="seed-input" value="-1" min="-1" max="2147483647">
                            <button id="seedRandomBtn" class="seed-btn" title="随机种子">↻</button>
                        </div>
                        <span class="param-hint">随机模式；固定数值可复现结果</span>
                    </div>

                    <!-- Sampler -->
                    <div class="param-group">
                        <div class="param-label-row">
                            <label class="param-label">采样器</label>
                        </div>
                        <div class="select-wrapper">
                            <select id="samplerSelect" class="param-select">
                                <option value="pingpong" selected>Ping-Pong（默认）</option>
                                <option value="euler">Euler（快速）</option>
                                <option value="rk4">RK4（高精度）</option>
                                <option value="dpmpp">DPM++（高质量）</option>
                            </select>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center: input + status + result -->
            <section class="center-panel">
                <!-- Input section -->
                <section class="input-section">
                    <label for="promptInput" class="input-label">描述你想要的音乐...</label>
                    <textarea id="promptInput" class="prompt-input" rows="3"
                        placeholder="例如：轻柔的钢琴曲，像下雨天的咖啡馆"></textarea>

                    <div class="duration-group">
                        <div class="duration-row">
                            <span class="duration-label">时 长</span>
                            <input type="range" id="durationSlider" min="15" max="120" step="5" value="90">
                            <span id="durationValue" class="duration-value">90秒</span>
                        </div>
                        <div class="duration-ticks">
                            <span>15秒</span>
                            <span>30秒</span>
                            <span>60秒</span>
                            <span>90秒</span>
                            <span>120秒</span>
                        </div>
                        <div class="duration-options" id="durationOptions">
                            <button class="dur-btn" data-duration="30">30秒</button>
                            <button class="dur-btn" data-duration="60">60秒</button>
                            <button class="dur-btn active" data-duration="90">90秒</button>
                            <button class="dur-btn" data-duration="120">120秒</button>
                        </div>
                    </div>

                    <button id="generateBtn" class="btn-generate">生成音乐</button>
                </section>

                <!-- Status area -->
                <section id="statusSection" class="status-section hidden">
                    <div id="statusMessage" class="status-message"></div>
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                </section>

                <!-- Result section -->
                <section id="resultSection" class="result-section hidden">
                    <!-- Collapsible prompt -->
                    <div class="collapsible-prompt">
                        <div id="promptHeader" class="prompt-header">
                            <span class="ornament">⚜️</span>
                            <span id="promptTitle" class="title">提示词</span>
                            <span id="promptArrow" class="arrow collapsed">❮</span>
                        </div>
                        <div id="promptBody" class="prompt-body">
                            <div id="enhancedPrompt" class="enhanced-prompt-text"></div>
                        </div>
                    </div>

                    <!-- Record player -->
                    <div class="record-player">
                        <div class="player-card">
                            <div class="player-top">
                                <div class="vinyl-disc">
                                    <div class="vinyl-label"></div>
                                </div>
                                <div class="player-meta">
                                    <div class="now-playing">正在播放</div>
                                    <div class="meta-sub" id="playerMeta">选择音乐开始</div>
                                </div>
                            </div>

                            <audio id="audioPlayer" preload="auto"></audio>

                            <div class="custom-controls">
                                <div class="progress-container">
                                    <div class="progress-track" id="progressTrack">
                                        <div class="progress-current" id="progressCurrent" style="width:0%"></div>
                                        <div class="progress-thumb" id="progressThumb" style="left:0%"></div>
                                    </div>
                                </div>
                                <div class="time-display">
                                    <span id="currentTime">00:00</span>
                                    <span id="totalTime">00:00</span>
                                </div>
                                <div class="controls-row">
                                    <button id="prevBtn" class="ctrl-btn" title="上一首">⏮</button>
                                    <button id="playBtn" class="play-btn">▶</button>
                                    <button id="nextBtn" class="ctrl-btn" title="下一首">⏭</button>
                                    <div class="volume-group">
                                        <span class="volume-icon">♬</span>
                                        <div class="volume-slider">
                                            <div class="volume-fill" id="volumeFill" style="width:70%"></div>
                                            <input type="range" id="volumeRange" min="0" max="100" value="70">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="player-actions">
                                <a id="downloadLink" class="btn-download" download>下载</a>
                            </div>
                        </div>
                    </div>
                </section>
            </section>

            <!-- Right: queue + history panel -->
            <aside class="right-panel">
                <div class="queue-panel">
                    <h3 class="queue-title">♬ 任务队列</h3>
                    <div id="queueList" class="queue-list"></div>
                    <div class="rh-divider"></div>
                    <div class="rh-section">
                        <div class="rh-header">
                            <h3 class="queue-title" style="margin-bottom:0;border-bottom:none;padding-bottom:0;">📜 历史记录</h3>
                            <button id="deleteAllBtn" class="rh-delete-all" title="删除全部">🗑</button>
                        </div>
                        <div id="rhList" class="rh-list"></div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Victorian modal for delete confirmation -->
    <div id="confirmModal" class="victorian-modal">
        <div class="modal-content">
            <div class="modal-ornament">✧</div>
            <h3>确认删除</h3>
            <p>确定要删除全部生成记录吗？<br>此操作不可撤销。</p>
            <div class="modal-actions">
                <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">取消</button>
                <button id="modalConfirmBtn" class="modal-btn modal-btn-danger">确认删除</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
